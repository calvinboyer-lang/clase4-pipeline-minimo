name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [app, model]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest
        working-directory: ${{ matrix.service }}
        run: uv run --python 3.12 --with-requirements requirements.txt --with pytest --with httpx pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: app
            port: 8080
          - service: model
            port: 8081
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t local-${{ matrix.service }} ./${{ matrix.service }}

      - name: Smoke test
        run: |
          docker run -d --name smoke-${{ matrix.service }} \
            -p ${{ matrix.port }}:8080 local-${{ matrix.service }}
          curl -sf --retry 20 --retry-delay 1 \
            http://localhost:${{ matrix.port }}/healthz
          docker rm -f smoke-${{ matrix.service }}

  publish:
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [app, model]
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      AR_REPO: ${{ vars.AR_REPOSITORY || 'infra-cloud-template' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        run: |
          test -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || {
            echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1;
          }
          test -n "${{ vars.GCP_SERVICE_ACCOUNT }}" || {
            echo "::error::Missing GCP_SERVICE_ACCOUNT"; exit 1;
          }
          [[ "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || {
            echo "::error::Provider must be the full resource name"; exit 1;
          }

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$SHORT_SHA" "./${{ matrix.service }}"
          docker push "$IMAGE:$SHORT_SHA"

          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi

